name: Extension Typecheck

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  extension-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup pnpm
        run: npm install --global pnpm@10.28.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare extension types
        run: pnpm --filter mcp-chrome-community-extension exec wxt prepare

      - name: Build shared package
        run: pnpm build:shared

      - name: Typecheck extension
        run: pnpm typecheck:extension
